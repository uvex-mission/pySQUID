[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pySQUID"
version = "0.1.0"
description = "Control and data-reduction tools for the UVEX SQUID camera testbed"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
  {name = "Chaz Shapiro"}
]
maintainers = [
  {name = "Chaz Shapiro"}
]
keywords = ["UVEX", "SQUID", "camera", "FITS", "TDMS"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "astropy",
  "PyYAML",
  "npTDMS",
  "ipython",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "flake8"
]
# cdssubtract_BBx.py only needs "catcam" when processing a whole directory
# of files at once (SERIES mode); it is not installable from PyPI, so it is
# not a hard dependency. Install it separately if you need that feature.

[project.scripts]
# Console-script entry points: pip generates cross-platform wrapper
# executables for these on install, backed by real Python callables.
cds = "pySQUID.cdssubtract_BBx:main"
tdms = "pySQUID.tdms_to_fits:main"

[tool.setuptools]
# Explicit package list (this is a flat layout: the pySQUID/ package
# directory sits next to this pyproject.toml).
packages = ["pySQUID"]

# pysquid is a bash script (not a Python callable), so it can't be a
# [project.scripts] entry point. setuptools installs it as-is onto PATH
# instead, alongside the console scripts above.
script-files = ["pySQUID/pysquid"]

[tool.setuptools.package-data]
# Ship the yaml files that tdms_to_fits.py and camera_class.py load at
# runtime relative to their own location.
pySQUID = ["fits_keyword_comments.yaml", "testbeds.yaml", "devices.yaml"]
