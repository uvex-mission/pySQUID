# testbeds.yaml
#
# Known SQUID testbeds and their default connection settings.
#
# Each top-level key is a TESTBED name that a user can reference from
# their own config YAML via the TESTBED key (see USER.yaml). camera_class.py
# looks up the matching entry here and uses it to fill in HOST, PORT, and
# any other testbed-specific parameters added in the future.
#
# Any key set in the user's own config file takes precedence over the
# value listed here for that testbed.

testbed1:
  HOST: 131.215.196.219   # IP of computer running SQUID server
  PORT: 7777              # SQUID server port

  # Optional Lakeshore temperature controller parameters
  # Set all three together to enable logging in TEMPDET FITS header
  # Comment out if no Lakeshore is attached
  LKS_HOST: uvextc1.caltech.edu  # Comment out if not using Lakeshore
  LKS_PORT: 7777
  LKS_CHAN: C  # Input channel to read for TEMPDET (A, B, C, D, D2, D3, D4)

  # Optional Keysight power supply parameters 
  # Set all three together to enable Camera's KEYSIGHT_* methods
  # Comment out if no Keysight is attached
  KEYSIGHT_HOST: 131.215.196.182
  KEYSIGHT_PORT: 5025     # SCPI/VXI-11 port
  KEYSIGHT_CHAN: 1        # Default channel (e.g. LED driver channel)
