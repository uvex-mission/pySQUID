# devices.yaml
#
# Known detectors and their default per-device settings.
#
# Each top-level key is a DETID that a user's config YAML references via
# the DETID key. camera_class.py looks up the matching entry here and
# uses it to fill in VEXTRAHI, VEXTRALO, and any other device-specific
# parameters added in the future.
#
# Any key set in the user's own config file takes precedence over the
# value listed here for that device. If a DETID isn't listed here at all,
# camera_class.py falls back to the DEFAULT entry below and prints a
# warning.

DEFAULT:
  VEXTRAHI: 3.011  # V_EXTRA for high gain
  VEXTRALO: 3.177  # V_EXTRA for low gain

W08D02:
  VEXTRAHI: 3.011  # V_EXTRA for high gain
  VEXTRALO: 3.177  # V_EXTRA for low gain
